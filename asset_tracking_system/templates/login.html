<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备资产定位管理系统 - 登录</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2c3e50;
        padding: 20px;
      }
      
      .login-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      
      .login-header {
        margin-bottom: 30px;
      }
      
      .login-header h1 {
        color: #2c3e50;
        font-size: 24px;
        font-weight: 600;
        margin: 15px 0 5px 0;
        line-height: 1.3;
      }
      
      .login-header .logo {
        font-size: 48px;
        color: #2c3e50;
        margin-bottom: 10px;
      }
      
      .login-header p {
        color: #7f8c8d;
        font-size: 14px;
        margin: 0;
      }
      
      .login-form {
        text-align: left;
      }
      
      .form-group {
        margin-bottom: 20px;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #2c3e50;
      }
      
      .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s ease;
        box-sizing: border-box;
      }
      
      .form-control:focus {
        outline: none;
        border-color: #2c3e50;
        box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
      }
      
      .btn-login {
        width: 100%;
        padding: 12px;
        background: #2c3e50;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease;
        margin-top: 10px;
      }
      
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
      }
      
      .login-footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
        color: #7f8c8d;
        font-size: 12px;
      }
      
      .error-message {
        background: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <i class="fas fa-satellite-dish"></i>
          </div>
          <h1>设备资产定位管理系统</h1>
          
        </div>
        
        <div class="error-message" id="errorMessage">
          用户名或密码错误，请重试
        </div>
        
        <form class="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">用户名</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              placeholder="请输入用户名"
              required
            />
          </div>
          
          <div class="form-group">
            <label for="password">密码</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="请输入密码"
              required
            />
          </div>
          
          <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> 登录系统
          </button>
        </form>
        
        <div class="login-footer">
          
          
        </div>
      </div>
    </div>

    <script>
      function handleLogin(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');
        
        // 简单的登录验证
        if (username === 'admin' && password === 'admin123') {
          // 登录成功
          errorMessage.style.display = 'none';
          
          // 显示登录成功消息
          const loginCard = document.querySelector('.login-card');
          loginCard.innerHTML = `
            <div class="login-header">
              <div class="logo">
                <i class="fas fa-check-circle" style="color: #28a745;"></i>
              </div>
              <h1>登录成功</h1>
              <p>正在跳转到系统主页...</p>
            </div>
          `;
          
          // 延迟跳转
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          // 登录失败
          errorMessage.style.display = 'block';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }
      
      // 页面加载时聚焦到用户名输入框
      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('username').focus();
      });
    </script>
  </body>
</html>
