<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基于星闪的智能资产追踪系统</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <!-- 左侧导航栏 -->
      <nav class="sidebar">
        <div class="sidebar-header">
          <h2><i class="fas fa-satellite-dish"></i> 星闪资产追踪</h2>
        </div>
        <div class="user-info">
          <i class="fas fa-user-circle"></i>
          <span>管理员</span>
          <button class="btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
        <ul class="nav-menu">
          <li
            class="nav-item {{ 'active' if active_page == 'asset_register' }}"
          >
            <a href="{{ url_for('asset_register') }}">
              <i class="fas fa-clipboard-list"></i>
              <span>资产登记</span>
            </a>
          </li>
          <li
            class="nav-item {{ 'active' if active_page == 'location_tracking' }}"
          >
            <a href="{{ url_for('location_tracking') }}">
              <i class="fas fa-map-marker-alt"></i>
              <span>位置追踪</span>
            </a>
          </li>
          <li
            class="nav-item {{ 'active' if active_page == 'borrow_management' }}"
          >
            <a href="{{ url_for('borrow_management') }}">
              <i class="fas fa-handshake"></i>
              <span>借用管理</span>
            </a>
          </li>
          <li
            class="nav-item {{ 'active' if active_page == 'maintenance_management' }}"
          >
            <a href="{{ url_for('maintenance_management') }}">
              <i class="fas fa-tools"></i>
              <span>维护管理</span>
            </a>
          </li>
          <li
            class="nav-item {{ 'active' if active_page == 'inventory_check' }}"
          >
            <a href="{{ url_for('inventory_check') }}">
              <i class="fas fa-search"></i>
              <span>盘点核查</span>
            </a>
          </li>
          <li
            class="nav-item {{ 'active' if active_page == 'report_statistics' }}"
          >
            <a href="{{ url_for('report_statistics') }}">
              <i class="fas fa-chart-bar"></i>
              <span>报表统计</span>
            </a>
          </li>
          <li
            class="nav-item {{ 'active' if active_page == 'permission_management' }}"
          >
            <a href="{{ url_for('permission_management') }}">
              <i class="fas fa-users-cog"></i>
              <span>权限管理</span>
            </a>
          </li>
          <li
            class="nav-item {{ 'active' if active_page == 'alert_notification' }}"
          >
            <a href="{{ url_for('alert_notification') }}">
              <i class="fas fa-bell"></i>
              <span>告警通知</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 右侧内容区域 -->
      <main class="main-content">
        <div class="content-body">{% block content %}{% endblock %}</div>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
